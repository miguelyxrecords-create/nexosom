services:
  - type: web
    name: nexosom-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nexosom
      - key: GOOGLE_CLIENT_ID
        value: 27874899160-9kb63e3gnr0vg7v5l6npgmg8jf5u89hc.apps.googleusercontent.com
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500
      - key: JWT_HOURS
        value: "12"
      - key: MAX_COVER_MB
        value: "5"
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.14.3
